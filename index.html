function exportCsv() {
  const rows = [
    ['Token', 'Patient', 'Age', 'Sex', 'Theatre', 'Surgeon', 'Specialty', 'Procedure', 'Anaesthetist',
     ...STAGES.map(s => s.label), 'Surgery duration (min)', 'Total duration (min)']
  ];
  state.cases.forEach(c => {
    const sd = totalDuration(c, 'surgery', 'completed');
    const td = totalDuration(c, 'preop', 'pacu') || totalDuration(c, 'preop', 'completed');
    rows.push([
      c.token, c.patientName, c.age || '', c.sex || '', c.theatre, c.surgeon || '', c.specialty || '',
      c.procedure || '', c.anaesthetist || '',
      ...STAGES.map(s => c.stages[s.id] ? c.stages[s.id].toLocaleTimeString('en-IN') : ''),
      sd != null ? Math.round(sd / 60000) : '',
      td != null ? Math.round(td / 60000) : ''
    ]);
  });
  const csv = rows.map(r => r.map(v => {
    const s = String(v ?? '');
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `KIMS-OT-${todayISO()}.csv`;
  a.click();
}

    if (aEmerg !== bEmerg) return aEmerg - bEmerg;
    if (aEmerg === 0) {

function avgDuration(cases, fromStage, toStage) {
  const arr = [];
  cases.forEach(c => {
    const d = totalDuration(c, fromStage, toStage);
    if (d != null && d > 0) arr.push(d);
  });
  return avgOf(arr);
}
function avgOf(arr) {
  if (!arr.length) return null;
  return arr.reduce((a, b) => a + b, 0) / arr.length;
}
function computeTurnover(cases) {
  const byTheatre = {};
  CONFIG.THEATRES.forEach(t => byTheatre[t] = []);
  CONFIG.THEATRES.forEach(t => {
    const inTheatre = cases.filter(c => c.theatre === t)
      .sort((a, b) => (a.stages.in_ot || new Date(0)) - (b.stages.in_ot || new Date(0)));
    for (let i = 1; i < inTheatre.length; i++) {
      const prev = inTheatre[i - 1];
      const next = inTheatre[i];
      // Turnover = previous patient OUT (pacu or completed) -> next patient IN (in_ot)
      const out = prev.stages.pacu || prev.stages.completed;
      const inT = next.stages.in_ot;
      if (out && inT && inT > out) byTheatre[t].push(inT - out);
    }
  });
  return byTheatre;
}

/* =========================================================
   OT ANALYTICS MODULE
   Pure-frontend analytics. Crunches the existing case data
   to produce OT utilisation, occupancy, and timing metrics.
   ========================================================= */

// State for the analytics panel — current view (day/week/month) and date
const analyticsState = {
  view: 'day',         // 'day' | 'week' | 'month'
  anchorDate: null,    // YYYY-MM-DD — the date the user is centred on
  loading: false,
  rangeCases: []       // cases for the current range (fetched on demand)
};

/**
 * Returns the start/end Date objects for a working day window
 * given a YYYY-MM-DD string. Uses CONFIG.OT_DAY_START_HOUR/END_HOUR.
 */
function otWindowFor(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const start = new Date(y, m - 1, d, CONFIG.OT_DAY_START_HOUR, 0, 0, 0);
  const end   = new Date(y, m - 1, d, CONFIG.OT_DAY_END_HOUR, 0, 0, 0);
  return { start, end, hours: (end - start) / 3600000 };
}

/**
 * Per-OT metrics for a single date.
 * Returns: { otName: { cases, firstStart, lastEnd, occupancyMs, surgeryMs,
 *                       turnovers[], overtimeMs, utilisationPct, surgeryUtilPct } }
 */
function computeDailyOTMetrics(cases, dateStr) {
  const { start: dayStart, end: dayEnd, hours: dayHours } = otWindowFor(dateStr);
  const dayMs = dayHours * 3600000;
  const result = {};

  CONFIG.THEATRES.forEach(ot => {
    const otCases = cases
      .filter(c => c.theatre === ot)
      .sort((a, b) => (a.stages.in_ot || a.stages.registered || new Date(0)) -
                       (b.stages.in_ot || b.stages.registered || new Date(0)));

    if (otCases.length === 0) {
      result[ot] = {
        cases: 0, firstStart: null, lastEnd: null,
        occupancyMs: 0, surgeryMs: 0, turnovers: [],
        overtimeMs: 0, utilisationPct: 0, surgeryUtilPct: 0
      };
      return;
    }

    // First-case start = first "In OT" timestamp of the day
    const firstStart = otCases.find(c => c.stages.in_ot)?.stages.in_ot || null;
    // Last-case end = the time the last patient LEFT the OT room.
    // Patient leaves OT after emergence (or surgery completion if no emergence recorded).
    // Subsequent PACU/discharge times are recovery — OT is free during those.
    let lastEnd = null;
    for (let i = otCases.length - 1; i >= 0; i--) {
      const end = otCases[i].stages.emergence || otCases[i].stages.completed;
      if (end) { lastEnd = end; break; }
    }

    // Occupancy = sum of (in_ot -> patient leaves OT) intervals.
    // The OT room itself is occupied from 'in_ot' until 'emergence' (or 'completed' fallback).
    // Once the patient moves to PACU/recovery, the OT is free.
    let occupancyMs = 0;
    let surgeryMs = 0;
    let overtimeMs = 0;
    otCases.forEach(c => {
      const inOt  = c.stages.in_ot;
      const outOt = c.stages.emergence || c.stages.completed;  // patient leaves the OT room
      if (inOt && outOt && outOt > inOt) {
        occupancyMs += (outOt - inOt);
        // Overtime = portion of this interval outside the working day window
        const overlap = Math.max(0, Math.min(outOt, dayEnd) - Math.max(inOt, dayStart));
        const total = outOt - inOt;
        overtimeMs += (total - overlap);
      }
      const surgStart = c.stages.surgery;
      const surgEnd   = c.stages.completed || c.stages.emergence;
      if (surgStart && surgEnd && surgEnd > surgStart) {
        surgeryMs += (surgEnd - surgStart);
      }
    });

    // Turnovers between consecutive cases.
    // Defined as: end of (case N in the OT room) → start of (case N+1 in the OT room).
    // This includes the room cleanup time + waiting for next patient.
    const turnovers = [];
    for (let i = 1; i < otCases.length; i++) {
      const prev = otCases[i - 1];
      const next = otCases[i];
      const out = prev.stages.emergence || prev.stages.completed;
      const inT = next.stages.in_ot;
      if (out && inT && inT > out) turnovers.push(inT - out);
    }

    // Utilisation: occupancy within the working day window / day window length
    let occupancyWithinDay = 0;
    otCases.forEach(c => {
      const inOt = c.stages.in_ot;
      const outOt = c.stages.emergence || c.stages.completed;
      if (inOt && outOt && outOt > inOt) {
        const overlap = Math.max(0, Math.min(outOt, dayEnd) - Math.max(inOt, dayStart));
        occupancyWithinDay += overlap;
      }
    });
    let surgeryWithinDay = 0;
    otCases.forEach(c => {
      const ss = c.stages.surgery;
      const se = c.stages.completed || c.stages.emergence;
      if (ss && se && se > ss) {
        const overlap = Math.max(0, Math.min(se, dayEnd) - Math.max(ss, dayStart));
        surgeryWithinDay += overlap;
      }
    });

    result[ot] = {
      cases: otCases.length,
      firstStart, lastEnd,
      occupancyMs, surgeryMs, turnovers, overtimeMs,
      utilisationPct: dayMs > 0 ? Math.min(100, (occupancyWithinDay / dayMs) * 100) : 0,
      surgeryUtilPct: dayMs > 0 ? Math.min(100, (surgeryWithinDay / dayMs) * 100) : 0
    };
  });

  return result;
}

/**
 * Format Date as HH:MM for the analytics tables.
 */
function fmtClock(d) {
  if (!d) return null;
  return d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: false });
}

/**
 * Format minutes as Hh Mm (e.g. "2h 30m") for compact display.
 */
function fmtHm(ms) {
  if (!ms || ms <= 0) return '—';
  const totalMin = Math.round(ms / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  if (h === 0) return `${m}m`;
  if (m === 0) return `${h}h`;
  return `${h}h ${m}m`;
}

/**
 * Returns date strings (YYYY-MM-DD) for a range, inclusive.
 * For weekly: returns 7 dates ending at anchorDate.
 * For monthly: returns 30 dates ending at anchorDate.
 */
function dateRangeFor(view, anchorDate) {
  const dates = [];
  const [y, m, d] = anchorDate.split('-').map(Number);
  const anchor = new Date(y, m - 1, d);
  const days = view === 'day' ? 1 : (view === 'week' ? 7 : 30);
  for (let i = days - 1; i >= 0; i--) {
    const x = new Date(anchor);
    x.setDate(anchor.getDate() - i);
    const ys = x.getFullYear();
    const ms = String(x.getMonth() + 1).padStart(2, '0');
    const ds = String(x.getDate()).padStart(2, '0');
    dates.push(`${ys}-${ms}-${ds}`);
  }
  return dates;
}

/**
 * Fetches cases for a date range. Uses today's cases (already loaded)
 * if the range only includes today; otherwise hits the API per date.
 */
async function fetchCasesForRange(dates) {
  const out = [];
  for (const d of dates) {
    if (d === todayISO()) {
      // Use already-loaded cases for today (no API call)
      state.cases.forEach(c => out.push({ ...c, _date: d }));
    } else {
      const data = await api('list', { date: d });
      (data.cases || []).map(normalizeCase).forEach(c => out.push({ ...c, _date: d }));
    }
  }
  return out;
}

/**
 * Renders the full OT Analytics section, including controls and the
 * current view's content. Returns HTML.
 */
function renderOTAnalytics() {
  const view = analyticsState.view;
  const date = analyticsState.anchorDate || todayISO();
  const rangeLabel = (() => {
    if (view === 'day') return new Date(date + 'T12:00:00').toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    const dates = dateRangeFor(view, date);
    const first = new Date(dates[0] + 'T12:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
    const last  = new Date(dates[dates.length - 1] + 'T12:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    return `${first} → ${last}`;
  })();

  return `
    <div class="analytics-section" id="ot-analytics">
      <div class="analytics-head">
        <div>
          <h3>OT Analytics</h3>
          <div class="sub">${escapeHtml(rangeLabel)} · OT working hours: ${String(CONFIG.OT_DAY_START_HOUR).padStart(2,'0')}:00 – ${String(CONFIG.OT_DAY_END_HOUR).padStart(2,'0')}:00</div>
        </div>
        <div class="analytics-controls">
          <div class="tab-row" role="tablist">
            <button class="${view === 'day' ? 'active' : ''}" data-view="day">Day</button>
            <button class="${view === 'week' ? 'active' : ''}" data-view="week">Week</button>
            <button class="${view === 'month' ? 'active' : ''}" data-view="month">Month</button>
          </div>
          <input type="date" id="analytics-date" value="${date}" max="${todayISO()}">
        </div>
      </div>

      <div id="analytics-body">
        ${analyticsState.loading
          ? `<div class="analytics-loading">Loading data…</div>`
          : renderAnalyticsView(view, date, analyticsState.rangeCases)
        }
      </div>
    </div>
  `;
}

function renderAnalyticsView(view, anchorDate, rangeCases) {
  if (view === 'day')   return renderAnalyticsDay(anchorDate, rangeCases);
  if (view === 'week')  return renderAnalyticsWeek(anchorDate, rangeCases);
  if (view === 'month') return renderAnalyticsMonth(anchorDate, rangeCases);
  return '';
}

/* ----- DAY VIEW ----- */
function renderAnalyticsDay(dateStr, rangeCases) {
  const dayCases = (rangeCases || []).filter(c => c._date === dateStr);
  const metrics = computeDailyOTMetrics(dayCases, dateStr);

  // Summary KPIs
  const activeOTs = Object.values(metrics).filter(m => m.cases > 0).length;
  const totalCases = dayCases.length;
  const allUtils = Object.values(metrics).filter(m => m.cases > 0).map(m => m.utilisationPct);
  const avgUtil = allUtils.length ? allUtils.reduce((s, v) => s + v, 0) / allUtils.length : 0;
  const allFirstStarts = Object.values(metrics).map(m => m.firstStart).filter(Boolean);
  const avgFirstStart = allFirstStarts.length
    ? new Date(allFirstStarts.reduce((s, d) => s + d.getTime(), 0) / allFirstStarts.length)
    : null;
  const allTurnovers = Object.values(metrics).flatMap(m => m.turnovers);
  const avgTurnover = allTurnovers.length ? allTurnovers.reduce((s, v) => s + v, 0) / allTurnovers.length : 0;
  const totalOvertimeMs = Object.values(metrics).reduce((s, m) => s + m.overtimeMs, 0);

  return `
    <div class="analytics-summary">
      <div class="kpi-mini">
        <div class="label">Active OTs</div>
        <div class="value">${activeOTs}<span style="font-size:14px; color:var(--ink-3); font-weight:400;"> / ${CONFIG.THEATRES.length}</span></div>
        <div class="sub">${totalCases} cases total</div>
      </div>
      <div class="kpi-mini">
        <div class="label">Avg utilisation</div>
        <div class="value">${avgUtil.toFixed(0)}%</div>
        <div class="sub">${String(CONFIG.OT_DAY_START_HOUR).padStart(2,'0')}:00–${String(CONFIG.OT_DAY_END_HOUR).padStart(2,'0')}:00 window</div>
      </div>
      <div class="kpi-mini">
        <div class="label">Avg first-case start</div>
        <div class="value">${avgFirstStart ? fmtClock(avgFirstStart) : '—'}</div>
        <div class="sub">Across active OTs</div>
      </div>
      <div class="kpi-mini">
        <div class="label">Avg turnover</div>
        <div class="value">${avgTurnover ? Math.round(avgTurnover / 60000) + 'm' : '—'}</div>
        <div class="sub">Between cases</div>
      </div>
      <div class="kpi-mini">
        <div class="label">Total overtime</div>
        <div class="value">${fmtHm(totalOvertimeMs)}</div>
        <div class="sub">Outside working hours</div>
      </div>
    </div>

    <div style="overflow-x:auto;">
      <table class="ot-analytics-table">
        <thead>
          <tr>
            <th style="width:70px;">OT</th>
            <th style="width:60px;">Cases</th>
            <th style="width:90px;">First start</th>
            <th style="width:90px;">Last end</th>
            <th style="width:90px;">Occupancy</th>
            <th style="width:90px;">Surgery time</th>
            <th style="width:90px;">Avg turnover</th>
            <th style="width:90px;">Overtime</th>
            <th>Utilisation</th>
          </tr>
        </thead>
        <tbody>
          ${CONFIG.THEATRES.map(ot => {
            const m = metrics[ot];
            const empty = m.cases === 0;
            const avgTo = m.turnovers.length ? Math.round(m.turnovers.reduce((s,v)=>s+v,0) / m.turnovers.length / 60000) : null;
            const utilClass = m.utilisationPct >= 80 ? 'high' : (m.utilisationPct >= 50 ? 'med' : 'low');
            // Late first start = after 09:00
            const lateStart = m.firstStart && m.firstStart.getHours() >= 9;
            return `
              <tr class="${empty ? 'ot-empty-row' : ''}">
                <td class="ot-name">${escapeHtml(ot)}</td>
                <td>${m.cases || '—'}</td>
                <td class="time-cell ${lateStart ? 'late' : ''}">${m.firstStart ? fmtClock(m.firstStart) : '<span class="empty-cell">—</span>'}</td>
                <td class="time-cell">${m.lastEnd ? fmtClock(m.lastEnd) : '<span class="empty-cell">—</span>'}</td>
                <td>${empty ? '—' : fmtHm(m.occupancyMs)}</td>
                <td>${empty ? '—' : fmtHm(m.surgeryMs)}</td>
                <td>${avgTo != null ? avgTo + 'm' : '<span class="empty-cell">—</span>'}</td>
                <td>${m.overtimeMs > 60000 ? fmtHm(m.overtimeMs) : '<span class="empty-cell">—</span>'}</td>
                <td>
                  <div class="util-bar-wrap">
                    <div class="util-bar"><div class="util-bar-fill ${utilClass}" style="width:${m.utilisationPct.toFixed(0)}%"></div></div>

    <div class="gantt-section">

          <span><span class="swatch" style="background:#1a4d8c;"></span>Surgery</span>
          <span><span class="swatch" style="background:#059669;"></span>Emergence</span>

/**
 * Gantt-style timeline showing each OT's day as horizontal bars
 * within the configured OT working window.
 */
function renderGantt(dayCases, dateStr) {
  const { start, end, hours } = otWindowFor(dateStr);

  if (dayCases.length === 0) {
    return `<div class="gantt-wrap"><div class="gantt-empty">No cases recorded for this day.</div></div>`;
  }

  // Build hour axis (e.g., 08, 09, 10, ..., 16 for default config = 8 hour buckets + final)
  const hourCount = Math.ceil(hours);
  const hourLabels = [];
  for (let i = 0; i < hourCount; i++) {
    const h = (CONFIG.OT_DAY_START_HOUR + i) % 24;
    hourLabels.push(String(h).padStart(2, '0'));
  }

  // For each OT, build bars for the cases that fall within the window
  const winMs = end - start;
  const otRows = CONFIG.THEATRES.map(ot => {
    const otCases = dayCases.filter(c => c.theatre === ot);
    const bars = [];
    otCases.forEach(c => {
      const inOt = c.stages.in_ot;
      const surgeryStart = c.stages.surgery;
      const surgeryEnd = c.stages.completed;
      const emergenceEnd = c.stages.emergence;  // patient leaves OT room

      const addBar = (s, e, cls, label) => {
        if (!s || !e || e <= s) return;
        // Clamp to window
        const s2 = Math.max(s.getTime(), start.getTime());
        const e2 = Math.min(e.getTime(), end.getTime());
        if (e2 <= s2) return;
        const left = ((s2 - start.getTime()) / winMs) * 100;
        const width = ((e2 - s2) / winMs) * 100;
        bars.push(`<div class="gantt-bar ${cls}" style="left:${left.toFixed(2)}%; width:${width.toFixed(2)}%;" title="${escapeHtml(label)}">${escapeHtml(c.token || '')}</div>`);
      };

      // In OT (prep) bar = in_ot -> surgery
      if (inOt && surgeryStart) addBar(inOt, surgeryStart, 'in-ot', `${c.token} · In OT prep`);
      // Surgery bar = surgery -> completed
      if (surgeryStart && surgeryEnd) addBar(surgeryStart, surgeryEnd, 'surgery', `${c.token} · ${c.procedure || 'Surgery'}`);
      // Emergence bar = completed -> emergence (when patient leaves OT)
      if (surgeryEnd && emergenceEnd) addBar(surgeryEnd, emergenceEnd, 'recovery', `${c.token} · Emergence`);
      // If only in_ot exists (case in progress, no surgery yet)
      if (inOt && !surgeryStart) {
        addBar(inOt, new Date(), 'in-ot', `${c.token} · In OT (ongoing)`);
      }
    });
    return { ot, bars };
  });

  // "Now" line if today and now is within the window
  const now = new Date();
  const showNow = dateStr === todayISO() && now >= start && now <= end;
  const nowLeft = showNow ? (((now - start) / winMs) * 100).toFixed(2) : null;

  return `
    <div class="gantt-wrap">
      <div class="gantt">
        <div class="gantt-axis">
          ${hourLabels.map(h => `<div class="hour">${h}:00</div>`).join('')}
        </div>
        ${otRows.map(r => `
          <div class="gantt-row">
            <div class="gantt-label">${escapeHtml(r.ot)}</div>
            <div class="gantt-track">
              ${r.bars.join('')}
              ${showNow && CONFIG.THEATRES.indexOf(r.ot) === 0 ? `<div class="gantt-now-line" style="left:${nowLeft}%;"></div>` : ''}
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

/* ----- WEEK VIEW ----- */
function renderAnalyticsWeek(dateStr, rangeCases) {
  const dates = dateRangeFor('week', dateStr);
  // Per-OT × per-date utilisation map
  const utilByOtDate = {};
  const dailyTotals = dates.map(d => {
    const dayCases = rangeCases.filter(c => c._date === d);
    const m = computeDailyOTMetrics(dayCases, d);
    CONFIG.THEATRES.forEach(ot => {
      utilByOtDate[ot] = utilByOtDate[ot] || {};
      utilByOtDate[ot][d] = m[ot];
    });
    const allUtils = Object.values(m).filter(x => x.cases > 0).map(x => x.utilisationPct);
    const avg = allUtils.length ? allUtils.reduce((s,v)=>s+v,0) / allUtils.length : 0;
    return { date: d, cases: dayCases.length, avgUtil: avg };
  });

  // Summary
  const totalCases = rangeCases.length;
  const weekUtils = dailyTotals.filter(d => d.cases > 0).map(d => d.avgUtil);
  const avgUtil = weekUtils.length ? weekUtils.reduce((s,v)=>s+v,0) / weekUtils.length : 0;
  const allOvertime = dates.reduce((sum, d) => {
    const m = computeDailyOTMetrics(rangeCases.filter(c => c._date === d), d);
    return sum + Object.values(m).reduce((s, x) => s + x.overtimeMs, 0);
  }, 0);
  const busiestDay = dailyTotals.slice().sort((a,b) => b.cases - a.cases)[0];

  return `
    <div class="analytics-summary">
      <div class="kpi-mini">
        <div class="label">Cases this week</div>
        <div class="value">${totalCases}</div>
        <div class="sub">${dates.length} days</div>
      </div>
      <div class="kpi-mini">
        <div class="label">Avg utilisation</div>
        <div class="value">${avgUtil.toFixed(0)}%</div>
        <div class="sub">Across all OTs &amp; days</div>
      </div>
      <div class="kpi-mini">
        <div class="label">Busiest day</div>
        <div class="value" style="font-size:18px;">${busiestDay && busiestDay.cases > 0 ? new Date(busiestDay.date + 'T12:00:00').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric' }) : '—'}</div>
        <div class="sub">${busiestDay ? busiestDay.cases + ' cases' : ''}</div>
      </div>
      <div class="kpi-mini">
        <div class="label">Total overtime</div>
        <div class="value">${fmtHm(allOvertime)}</div>
        <div class="sub">Outside working hours</div>
      </div>
    </div>

    <div class="heatmap-section">
      <h4>Utilisation Heatmap · % per OT per day</h4>
      <div class="heatmap-wrap">
        <table class="heatmap">
          <thead>
            <tr>
              <th style="width:80px;">OT</th>
              ${dates.map(d => {
                const dt = new Date(d + 'T12:00:00');
                return `<th>${dt.toLocaleDateString('en-IN', { weekday: 'short' })}<br><span style="font-weight:400; font-size:9px;">${dt.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' })}</span></th>`;
              }).join('')}
              <th style="width:60px;">Avg</th>
            </tr>
          </thead>
          <tbody>
            ${CONFIG.THEATRES.map(ot => {
              const otRow = dates.map(d => utilByOtDate[ot][d]);
              const otAvg = otRow.filter(x => x && x.cases > 0).map(x => x.utilisationPct);
              const avgU = otAvg.length ? otAvg.reduce((s,v)=>s+v,0) / otAvg.length : 0;
              return `
                <tr>
                  <td class="ot-label">${escapeHtml(ot)}</td>
                  ${otRow.map(m => {
                    if (!m || m.cases === 0) {
                      return `<td class="heat-cell no-data">—</td>`;
                    }
                    const pct = m.utilisationPct;
                    const color = heatColor(pct);
                    return `<td class="heat-cell" style="background:${color};" title="${pct.toFixed(0)}% · ${m.cases} cases">${pct.toFixed(0)}%</td>`;
                  }).join('')}
                  <td class="heat-cell" style="background:${avgU > 0 ? heatColor(avgU) : 'var(--surface-2)'}; color:${avgU > 0 ? 'white' : 'var(--ink-3)'};">${otAvg.length ? avgU.toFixed(0) + '%' : '—'}</td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

/* ----- MONTH VIEW ----- */
function renderAnalyticsMonth(dateStr, rangeCases) {
  const dates = dateRangeFor('month', dateStr);
  const daily = dates.map(d => {
    const dayCases = rangeCases.filter(c => c._date === d);
    const m = computeDailyOTMetrics(dayCases, d);
    const utils = Object.values(m).filter(x => x.cases > 0).map(x => x.utilisationPct);
    const turnovers = Object.values(m).flatMap(x => x.turnovers);
    const firstStarts = Object.values(m).map(x => x.firstStart).filter(Boolean);
    const overtimeMs = Object.values(m).reduce((s, x) => s + x.overtimeMs, 0);
    return {
      date: d,
      cases: dayCases.length,
      avgUtil: utils.length ? utils.reduce((s,v)=>s+v,0) / utils.length : 0,
      avgTurnover: turnovers.length ? turnovers.reduce((s,v)=>s+v,0) / turnovers.length : 0,
      avgFirstStart: firstStarts.length ? firstStarts.reduce((s,d)=>s+d.getTime(),0) / firstStarts.length : null,
      overtimeMs
    };
  });

  // Summary KPIs
  const totalCases = rangeCases.length;
  const activeDays = daily.filter(d => d.cases > 0).length;
  const avgUtilOverall = (() => {
    const u = daily.filter(d => d.cases > 0).map(d => d.avgUtil);
    return u.length ? u.reduce((s,v)=>s+v,0) / u.length : 0;
  })();
  const avgCasesPerDay = activeDays > 0 ? (totalCases / activeDays).toFixed(1) : 0;
  const allFirstStarts = daily.map(d => d.avgFirstStart).filter(Boolean);
  const avgFirstStart = allFirstStarts.length ? new Date(allFirstStarts.reduce((s,t)=>s+t,0) / allFirstStarts.length) : null;
  const onTimeDays = daily.filter(d => d.avgFirstStart && new Date(d.avgFirstStart).getHours() < 9).length;
  const onTimePct = activeDays > 0 ? (onTimeDays / activeDays) * 100 : 0;
  const totalOvertime = daily.reduce((s,d) => s + d.overtimeMs, 0);

  return `
    <div class="analytics-summary">
      <div class="kpi-mini">
        <div class="label">Total cases</div>
        <div class="value">${totalCases}</div>
        <div class="sub">${activeDays} active days · ${avgCasesPerDay}/day avg</div>
      </div>
      <div class="kpi-mini">
        <div class="label">Avg utilisation</div>
        <div class="value">${avgUtilOverall.toFixed(0)}%</div>
        <div class="sub">Across the month</div>
      </div>
      <div class="kpi-mini">
        <div class="label">Avg first-case start</div>
        <div class="value">${avgFirstStart ? fmtClock(avgFirstStart) : '—'}</div>
        <div class="sub">${onTimePct.toFixed(0)}% of days started before 09:00</div>
      </div>
      <div class="kpi-mini">
        <div class="label">Total overtime</div>
        <div class="value">${fmtHm(totalOvertime)}</div>
        <div class="sub">Hours outside ${String(CONFIG.OT_DAY_START_HOUR).padStart(2,'0')}:00–${String(CONFIG.OT_DAY_END_HOUR).padStart(2,'0')}:00</div>
      </div>
    </div>

    <div class="trend-section">
      <div class="trend-grid">
        ${renderTrendCard('Utilisation %', daily.map(d => d.avgUtil), '%', avgUtilOverall.toFixed(0) + '%')}
        ${renderTrendCard('Cases per day', daily.map(d => d.cases), '', avgCasesPerDay)}
        ${renderTrendCard('Avg turnover (min)', daily.map(d => d.avgTurnover / 60000), 'm', daily.filter(d => d.avgTurnover > 0).length ? Math.round(daily.filter(d => d.avgTurnover > 0).reduce((s,d)=>s + d.avgTurnover, 0) / daily.filter(d => d.avgTurnover > 0).length / 60000) + 'm' : '—')}
        ${renderTrendCard('First-case start (hr)', daily.map(d => d.avgFirstStart ? (new Date(d.avgFirstStart).getHours() + new Date(d.avgFirstStart).getMinutes() / 60) : 0), 'h', avgFirstStart ? fmtClock(avgFirstStart) : '—')}
      </div>
    </div>

    <div style="overflow-x:auto; margin-top:20px;">
      <table class="ot-analytics-table">
        <thead>
          <tr>
            <th style="width:100px;">Date</th>
            <th style="width:80px;">Cases</th>
            <th style="width:110px;">First start</th>
            <th style="width:110px;">Avg turnover</th>
            <th style="width:110px;">Overtime</th>
            <th>Utilisation</th>
          </tr>
        </thead>
        <tbody>
          ${daily.slice().reverse().map(d => {
            const empty = d.cases === 0;
            const utilClass = d.avgUtil >= 80 ? 'high' : (d.avgUtil >= 50 ? 'med' : 'low');
            const lateStart = d.avgFirstStart && new Date(d.avgFirstStart).getHours() >= 9;
            const dt = new Date(d.date + 'T12:00:00');
            return `
              <tr class="${empty ? 'ot-empty-row' : ''}">
                <td class="ot-name" style="font-size:12px;">${dt.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' })}</td>
                <td>${d.cases || '—'}</td>
                <td class="time-cell ${lateStart ? 'late' : ''}">${d.avgFirstStart ? fmtClock(new Date(d.avgFirstStart)) : '<span class="empty-cell">—</span>'}</td>
                <td>${d.avgTurnover > 0 ? Math.round(d.avgTurnover / 60000) + 'm' : '<span class="empty-cell">—</span>'}</td>
                <td>${d.overtimeMs > 60000 ? fmtHm(d.overtimeMs) : '<span class="empty-cell">—</span>'}</td>
                <td>
                  <div class="util-bar-wrap">
                    <div class="util-bar"><div class="util-bar-fill ${utilClass}" style="width:${d.avgUtil.toFixed(0)}%"></div></div>
                    <span class="util-pct">${d.avgUtil.toFixed(0)}%</span>
                  </div>
                </td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

/** Simple inline SVG sparkline trend card */
function renderTrendCard(label, values, unit, summaryText) {
  const max = Math.max(1, ...values);
  const min = Math.min(0, ...values);
  const range = max - min || 1;
  const w = 280, h = 60;
  const xs = values.map((_, i) => (i / Math.max(1, values.length - 1)) * w);
  const ys = values.map(v => h - ((v - min) / range) * (h - 8) - 4);
  const points = xs.map((x, i) => `${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
  // Area fill points
  const area = `0,${h} ${points} ${w},${h}`;
  return `
    <div class="trend-card">
      <h5>${escapeHtml(label)}</h5>
      <div class="big-num">${escapeHtml(String(summaryText))}</div>
      <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <polygon points="${area}" fill="rgba(26,77,140,0.10)"/>
        <polyline points="${points}" fill="none" stroke="#1a4d8c" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
    </div>
  `;
}

/** Returns a heatmap colour for a utilisation %. */
function heatColor(pct) {
  // 0% = light blue, 50% = amber, 100% = deep red
  if (pct < 25)  return '#94a3b8';        // grey-blue (low)
  if (pct < 50)  return '#60a5fa';        // blue
  if (pct < 70)  return '#10b981';        // green (healthy)
  if (pct < 85)  return '#f59e0b';        // amber (high)
  return '#ef4444';                       // red (saturation)
}

/** Re-renders just the analytics body (after view/date change). */
async function refreshAnalyticsBody() {
  analyticsState.loading = true;
  const body = $('#analytics-body');
  if (body) body.innerHTML = `<div class="analytics-loading">Loading data…</div>`;

  const view = analyticsState.view;
  const date = analyticsState.anchorDate;
  const dates = dateRangeFor(view, date);
  try {
    analyticsState.rangeCases = await fetchCasesForRange(dates);
  } catch (e) {
    if (body) body.innerHTML = `<div class="analytics-loading" style="color:#b91c1c;">Failed to load analytics: ${escapeHtml(e.message)}</div>`;
    analyticsState.loading = false;
    return;
  }
  analyticsState.loading = false;

  // Re-render the head label (range can change) AND body
  const section = $('#ot-analytics');
  if (section) section.outerHTML = renderOTAnalytics();
  attachAnalyticsHandlers();
}

function attachAnalyticsHandlers() {
  // Tab switching
  $$('#ot-analytics [data-view]').forEach(btn => {
    btn.addEventListener('click', () => {
      analyticsState.view = btn.dataset.view;
      refreshAnalyticsBody();
    });
  });
  // Date picker
  const dp = $('#analytics-date');
  if (dp) {
    dp.addEventListener('change', () => {
      analyticsState.anchorDate = dp.value;
      refreshAnalyticsBody();
    });
  }
}

/* =========================================================
   LOBBY DISPLAY
   ========================================================= */
// Recently-discharged cases stay visible for this many hours after
// 'Shifted to Ward' so families get explicit closure.
const LOBBY_DISCHARGED_GRACE_MS = 3 * 60 * 60 * 1000;  // 3 hours

function renderLobby() {
  const setupOk = !!CONFIG.APPS_SCRIPT_URL;
  const now = new Date();
  const cutoff = now.getTime() - LOBBY_DISCHARGED_GRACE_MS;

  // Split today's cases into two groups:
  // 1) Active — anything not yet discharged
  // 2) Recently discharged — discharged within the last 3 hours
  const activeCases = state.cases.filter(c => !c.stages.discharged);
  const recentlyDischarged = state.cases.filter(c => {
    if (!c.stages.discharged) return false;
    const dt = c.stages.discharged instanceof Date ? c.stages.discharged.getTime() : new Date(c.stages.discharged).getTime();
    return dt >= cutoff;
  }).sort((a, b) => {
    // Most recently discharged first
    const aT = a.stages.discharged instanceof Date ? a.stages.discharged.getTime() : new Date(a.stages.discharged).getTime();
    const bT = b.stages.discharged instanceof Date ? b.stages.discharged.getTime() : new Date(b.stages.discharged).getTime();
    return bT - aT;
  });

  return `
    <div class="lobby">
      <div class="lobby-head">
        <div>
          <h1>Operation Theatre Status</h1>
          <div class="sub">${escapeHtml(CONFIG.HOSPITAL_NAME)} · ${escapeHtml(CONFIG.DEPARTMENT_NAME)}</div>
        </div>
        <div class="lobby-clock">
          <div class="time" id="lobby-time">${now.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit', hour12:true})}</div>
          <div class="date">${now.toLocaleDateString('en-IN', {weekday:'long', day:'numeric', month:'long'})}</div>
        </div>
      </div>

      ${!setupOk
        ? `<div class="empty-state" style="color:#fff; opacity:0.7;"><div class="big">⚙</div><div>Waiting for setup…</div></div>`
        : (activeCases.length === 0 && recentlyDischarged.length === 0)
          ? `<div class="lobby-empty">No active cases at the moment</div>`
          : `
            ${activeCases.length > 0 ? `
              <div class="lobby-grid">
                ${activeCases.map(c => renderLobbyTile(c, false)).join('')}
              </div>
            ` : `
              <div class="lobby-empty" style="font-size:22px; padding:40px 20px;">All current cases have been moved to ward</div>
            `}

            ${recentlyDischarged.length > 0 ? `
              <div class="lobby-discharged-section">
                <div class="lobby-discharged-head">
                  <div class="lobby-discharged-title">
                    <span class="check">✓</span>Recently Moved to Ward
                  </div>
                  <div class="lobby-discharged-sub">Shown for ${LOBBY_DISCHARGED_GRACE_MS / 3600000} hours after transfer · ${recentlyDischarged.length} ${recentlyDischarged.length === 1 ? 'patient' : 'patients'}</div>
                </div>
                <div class="lobby-discharged-grid">
                  ${recentlyDischarged.map(c => renderLobbyTile(c, true)).join('')}
                </div>
              </div>
            ` : ''}
          `
      }

      <div class="lobby-foot">
        <div class="privacy-block">
          <span class="privacy-strong">For your privacy, patients are shown by token number only.</span>
          Please approach the OT reception desk for any questions about your relative's status.
        </div>
        <div class="refresh-block">
          Updates every ${CONFIG.REFRESH_MS/1000}s<br>Last updated ${state.lastFetch ? fmtTime(state.lastFetch) : '—'}
        </div>
      </div>
    </div>
  `;
}

function renderLobbyTile(c, isDischarged) {
  const stage = currentStage(c);
  const since = timeSinceStage(c, stage.id);
  const dur = c.expected_duration_min;
  const durLabel = dur ? formatExpectedDuration(dur) : '';

  // For discharged tiles, override the display with a calm "Moved to ward" message
  // and show the time of transfer rather than the elapsed time in the stage.
  if (isDischarged) {
    const dt = c.stages.discharged instanceof Date ? c.stages.discharged : new Date(c.stages.discharged);
    const timeStr = dt.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
    return `
      <div class="lobby-tile discharged" data-token="${escapeHtml(c.token)}">
        <div class="token-row">
          <div class="token">${escapeHtml(c.token || '—')}</div>
          <div class="ot-tag">${escapeHtml(c.theatre || '')}</div>
        </div>
        <div class="surgeon">${escapeHtml(c.surgeon ? 'Surgeon: ' + c.surgeon : 'Surgical team')}</div>
        <div class="status-row">
          <div class="stage-dot"></div>
          <div class="stage-text">Moved to Ward</div>
        </div>
        <div class="lobby-meta">
          <span class="discharge-time">Transferred at ${escapeHtml(timeStr)}</span>
        </div>
      </div>
    `;
  }

  return `
    <div class="lobby-tile" data-token="${escapeHtml(c.token)}">
      <div class="token-row">
        <div class="token">${escapeHtml(c.token || '—')}</div>
        <div class="ot-tag">${escapeHtml(c.theatre || '')}</div>
      </div>
      <div class="surgeon">${escapeHtml(c.surgeon ? 'Surgeon: ' + c.surgeon : 'Surgical team')}</div>
      <div class="status-row">
        <div class="stage-dot" style="background:var(--${stage.color}); color:var(--${stage.color});"></div>
        <div class="stage-text">${escapeHtml(stage.lobby)}</div>
      </div>
      <div class="lobby-meta">
        ${since != null ? `<span>${fmtDuration(since)} in this stage</span>` : ''}
        ${durLabel ? `<span class="duration-pill">Expected: ${escapeHtml(durLabel)}</span>` : ''}
      </div>
    </div>
  `;
}

function formatExpectedDuration(min) {
  const m = parseInt(min, 10);
  if (isNaN(m) || m <= 0) return '';
  if (m < 60) return `~${m} minutes`;
  if (m === 60) return '~1 hour';
  if (m % 60 === 0) return `~${m / 60} hours`;
  return `~${(m / 60).toFixed(1)} hours`;
}

function attachLobbyHandlers() {
  // Update clock every minute
  if (lobbyClockTimer) clearInterval(lobbyClockTimer);
  lobbyClockTimer = setInterval(() => {
    const t = $('#lobby-time');
    if (t) t.textContent = new Date().toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit', hour12:true});
  }, 30000);

  // Start the splash rotator — but only once, not on every refresh.
  // The lobby calls attachLobbyHandlers() every ~15s when data refreshes;
  // we don't want to reset the splash timer that often.
  if (!splashTimers.initialised) {
    splashTimers.initialised = true;
    startLobbySplash();
  }
}
let lobbyClockTimer = null;

/* =========================================================
   LOBBY SPLASH SCREEN
   Periodic welcome message that takes over the lobby display
   for ~60 seconds every 5 minutes. Five carefully chosen slides
   that acknowledge the family's wait, set expectations, and
   thank them.
   ========================================================= */

const SPLASH_INTERVAL_MS = 5 * 60 * 1000;   // every 5 minutes
const SPLASH_SLIDE_MS = 12 * 1000;          // each slide shown for 12s

const SPLASH_SLIDES = [
  {
    eyebrow: 'A WARM WELCOME',
    title: 'Welcome.',
    body: 'While you wait, we are taking care of your loved one.',
    foot: 'Department of Anaesthesia · KIMS Hospital, Mahadevapura'
  },
  {
    eyebrow: 'WHAT TO EXPECT',
    title: 'Surgery is a journey,<br><span class="accent">not a moment.</span>',
    body: 'From preparation to recovery, your loved one will pass through several stages — <strong>each one important, each one carefully attended to.</strong>'
  },
  {
    eyebrow: 'UNDERSTANDING THE SCREEN',
    title: 'What you\'ll see',
    stages: [
      { name: 'In Pre-Op',          desc: 'Final checks before surgery' },
      { name: 'In OT',              desc: 'In the theatre, preparation underway' },
      { name: 'Surgery in progress', desc: 'The operation is happening' },
      { name: 'Preparing for recovery', desc: 'Surgery done, careful next steps' },
      { name: 'In Recovery',        desc: 'Being monitored before the ward' },
      { name: 'Moved to Ward',      desc: 'Safely transferred to rest' }
    ]
  },
  {
    eyebrow: 'A GENTLE REMINDER',
    title: 'Stages take time.<br><span class="accent">That is good.</span>',
    body: 'Your loved one is in skilled hands. Every stage — anaesthesia, surgery, recovery — is given the time it needs. <strong>We do not rush. We do it well.</strong>'
  },
  {
    eyebrow: 'WITH GRATITUDE',
    title: 'Thank you for<br>trusting us with<br><span class="accent">someone you love.</span>',
    foot: 'Department of Anaesthesia · KIMS Hospital, Mahadevapura'
  }
];

let splashTimers = {
  initialised: false,
  firstShow: null,
  interval: null,
  slideTimers: [],
  fadeOutTimer: null
};

function startLobbySplash() {
  // Show splash for the first time after 15s (gives the page a moment to settle),
  // then every SPLASH_INTERVAL_MS thereafter.
  const initialDelay = 15 * 1000;
  splashTimers.firstShow = setTimeout(() => {
    runSplashCycle();
    splashTimers.interval = setInterval(runSplashCycle, SPLASH_INTERVAL_MS);
  }, initialDelay);
}

function runSplashCycle() {
  // Don't show splash if there are no cases at all (lobby is empty anyway)
  if (state.cases.length === 0) return;

  // Don't stack splashes if one is somehow still on screen
  const existing = $('#lobby-splash');
  if (existing) existing.remove();
  splashTimers.slideTimers.forEach(t => clearTimeout(t));
  splashTimers.slideTimers = [];
  if (splashTimers.fadeOutTimer) clearTimeout(splashTimers.fadeOutTimer);

  // Create the splash container
  const splash = document.createElement('div');
  splash.id = 'lobby-splash';
  splash.className = 'lobby-splash';

  // Build all slides upfront, only first is .active
  splash.innerHTML = `
    ${SPLASH_SLIDES.map((s, i) => renderSplashSlide(s, i)).join('')}
    <div class="splash-progress">
      ${SPLASH_SLIDES.map((_, i) => `<span class="dot ${i === 0 ? 'active' : ''}" data-slide-dot="${i}"></span>`).join('')}
    </div>
    <div class="splash-corner-mark">KIMS · Mahadevapura</div>
  `;

  document.body.appendChild(splash);

  // Fade in
  requestAnimationFrame(() => {
    splash.classList.add('visible');
    const first = splash.querySelector('[data-slide-idx="0"]');
    if (first) first.classList.add('active');
  });

  // Schedule slide transitions
  SPLASH_SLIDES.forEach((_, i) => {
    if (i === 0) return; // first is already active
    const t = setTimeout(() => {
      // Hide previous
      const prev = splash.querySelector('.splash-slide.active');
      if (prev) prev.classList.remove('active');
      const prevDot = splash.querySelector(`.dot.active`);
      if (prevDot) prevDot.classList.remove('active');
      // Show current after a brief gap (for the fade-out)
      setTimeout(() => {
        const cur = splash.querySelector(`[data-slide-idx="${i}"]`);
        if (cur) cur.classList.add('active');
        const dot = splash.querySelector(`[data-slide-dot="${i}"]`);
        if (dot) dot.classList.add('active');
      }, 600);
    }, i * SPLASH_SLIDE_MS);
    splashTimers.slideTimers.push(t);
  });

  // Schedule fade-out after the last slide
  splashTimers.fadeOutTimer = setTimeout(() => {
    splash.classList.remove('visible');
    setTimeout(() => splash.remove(), 1500);
  }, SPLASH_SLIDES.length * SPLASH_SLIDE_MS);
}

function renderSplashSlide(slide, idx) {
  if (slide.stages) {
    // Stage-guide slide
    return `
      <div class="splash-slide" data-slide-idx="${idx}">
        ${slide.eyebrow ? `<div class="splash-eyebrow">${escapeHtml(slide.eyebrow)}</div>` : ''}
        <div class="splash-title">${slide.title}</div>
        <div class="splash-stages">
          ${slide.stages.map(s => `
            <div class="stage-item">
              <div class="stage-name">${escapeHtml(s.name)}</div>
              <div class="stage-desc">${escapeHtml(s.desc)}</div>
            </div>
          `).join('')}
        </div>
        ${slide.foot ? `<div class="splash-foot">${escapeHtml(slide.foot)}</div>` : ''}
      </div>
    `;
  }
  // Regular content slide
  return `
    <div class="splash-slide" data-slide-idx="${idx}">
      ${slide.eyebrow ? `<div class="splash-eyebrow">${escapeHtml(slide.eyebrow)}</div>` : ''}
      <div class="splash-title">${slide.title}</div>
      ${slide.body ? `<div class="splash-body">${slide.body}</div>` : ''}
      ${slide.foot ? `<div class="splash-foot">${escapeHtml(slide.foot)}</div>` : ''}
    </div>
  `;
}

/* =========================================================
   OT RECEPTION BOARD (Row-Table Layout)
   Staff-facing operational board. Shows ALL cases per OT
   for today (resets at midnight IST automatically because
   the backend filters by date).
   ========================================================= */
function renderBoard() {
  const setupOk = !!CONFIG.APPS_SCRIPT_URL;
  const now = new Date();

  // Group cases by theatre
  const casesByOT = {};
  CONFIG.THEATRES.forEach(t => casesByOT[t] = []);
  state.cases.forEach(c => {
    if (casesByOT[c.theatre]) casesByOT[c.theatre].push(c);
  });
  // Sort within each OT: active cases first, then completed cases
  // ordered by most recent first (so latest activity is at the top of each group)
  Object.values(casesByOT).forEach(arr => {
    arr.sort((a, b) => {
      const aFin = isFinished(a) ? 1 : 0;
      const bFin = isFinished(b) ? 1 : 0;
      if (aFin !== bFin) return aFin - bFin;
      return new Date(b.created) - new Date(a.created);
    });
  });

  // Build rows: each OT in order, all its cases in sorted order.
  // If an OT has no cases at all, show one "Available" row.
  const rows = [];
  CONFIG.THEATRES.forEach(t => {
    const list = casesByOT[t];
    if (list.length === 0) {
      rows.push(renderBoardRowEmpty(t));
    } else {
      list.forEach((c, idx) => rows.push(renderBoardRowCase(t, c, idx === 0)));
    }
  });

  return `
    <div class="board">
      <div class="board-head">
        <div>
          <h1>OT Reception Board</h1>
          <div class="sub">${escapeHtml(CONFIG.HOSPITAL_NAME)} · ${escapeHtml(CONFIG.DEPARTMENT_NAME)} · Staff View · ${state.cases.length} cases today</div>
        </div>
        <div class="board-clock">
          <div class="time" id="board-time">${now.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit', hour12:true})}</div>
          <div class="date">${now.toLocaleDateString('en-IN', {weekday:'long', day:'numeric', month:'long'})}</div>
        </div>
      </div>

      ${!setupOk
        ? `<div class="empty-state" style="color:#fff; opacity:0.7;"><div class="big">⚙</div><div>Waiting for setup…</div></div>`
        : `<div class="board-table-wrap">
            <table class="board-table">
              <thead>
                <tr>
                  <th style="width:80px;">OT</th>
                  <th style="width:90px;">Token</th>
                  <th style="width:200px;">Patient</th>
                  <th class="col-procedure-h">Procedure</th>
                  <th class="col-surgeon-h" style="width:160px;">Surgeon</th>
                  <th style="width:200px;">Stage</th>
                  <th style="width:80px; text-align:right;">Time</th>
                </tr>
              </thead>
              <tbody>
                ${rows.join('')}
              </tbody>
            </table>
          </div>`
      }

      <div class="board-foot">
        <div class="board-legend">
          <span><span class="swatch" style="background:#fff; opacity:0.4;"></span>Available</span>
          <span><span class="swatch" style="background:#3b82f6;"></span>Active case</span>
          <span><span class="swatch" style="background:#f59e0b;"></span>Running long</span>
          <span><span class="swatch" style="background:#ef4444;"></span>Significantly delayed</span>
        </div>
        <div>Auto-refresh every ${CONFIG.REFRESH_MS/1000}s · Last updated ${state.lastFetch ? fmtTime(state.lastFetch) : '—'} · Day resets at midnight IST</div>
      </div>
    </div>
  `;
}

function renderBoardRowEmpty(theatre) {
  return `<tr class="empty active-bar ot-row-first">
    <td class="col-ot">${escapeHtml(theatre)}</td>
    <td colspan="6" class="available-cell">Available</td>
  </tr>`;
}

function renderBoardRowCase(theatre, c, isFirstForOT) {
  const stage = currentStage(c);
  const since = timeSinceStage(c, stage.id);
  const finished = isFinished(c);

  // Urgency flags (only for active cases)
  let rowClass = isFirstForOT ? 'ot-row-first' : 'ot-row-cont';
  if (finished) {
    rowClass += ' completed';
  } else {
    rowClass += ' active-bar';
    if (stage.id === 'preop' && since > 60 * 60 * 1000) rowClass += ' warn';
    if (stage.id === 'in_ot' && since > 30 * 60 * 1000) rowClass += ' warn';
    if (stage.id === 'surgery' && since > 3 * 60 * 60 * 1000) rowClass += ' danger';
    if (stage.id === 'preop' && since > 2 * 60 * 60 * 1000) rowClass += ' danger';
  }

  // Show OT name only on the first row for this OT - subsequent rows show
  // a small continuation marker so the table reads cleanly
  const otCell = isFirstForOT
    ? `<td class="col-ot">${escapeHtml(theatre)}</td>`
    : `<td class="col-ot col-ot-cont">↳</td>`;

  // Token cell: show scheduled time or EMERG above the token
  const schedLine = c.case_type === 'emergency'
    ? `<div style="font-size:10px; font-weight:700; color:#fca5a5; letter-spacing:0.05em;">EMERG</div>`
    : (c.scheduled_time ? `<div style="font-size:11px; opacity:0.7; font-variant-numeric:tabular-nums;">⏱ ${escapeHtml(c.scheduled_time)}</div>` : '');

  return `<tr class="${rowClass}">
    ${otCell}
    <td class="col-token">${schedLine}${escapeHtml(c.token || '')}</td>
    <td class="col-patient" title="${escapeHtml(c.patientName || '')}">${escapeHtml(c.patientName || '—')}</td>
    <td class="col-procedure" title="${escapeHtml(c.procedure || c.specialty || '')}">${escapeHtml(c.procedure || c.specialty || '—')}</td>
    <td class="col-surgeon" title="${escapeHtml(c.surgeon || '')}">${escapeHtml(c.surgeon || '—')}</td>
    <td class="col-stage">
      <span class="stage-pill" style="background:var(--${stage.color}-bg); color:var(--${stage.color});">${escapeHtml(stage.label)}</span>
    </td>
    <td class="col-elapsed">${since != null ? fmtDuration(since) : ''}</td>
  </tr>`;
}

let boardClockTimer = null;
function attachBoardHandlers() {
  if (boardClockTimer) clearInterval(boardClockTimer);
  boardClockTimer = setInterval(() => {
    const t = $('#board-time');
    if (t) t.textContent = new Date().toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit', hour12:true});
  }, 30000);
}


/* =========================================================
   SHARED UI
   ========================================================= */
function renderTopbar(viewLabel) {
  const onlineClass = state.online ? '' : 'offline';
  return `
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand">
          <div class="brand-mark">K</div>
          <div class="brand-text">
            <div class="title">KIMS OT Tracker</div>
            <div class="sub">${escapeHtml(viewLabel)}</div>
          </div>
        </div>
      </div>
      <div style="display:flex; gap:8px; align-items:center;">
        <span class="connection-pill ${onlineClass}">${state.online ? 'Live' : 'Offline'}</span>
        <button class="btn sm" id="refresh-btn" title="Refresh">↻</button>
        <button class="btn sm ghost" id="switch-view-btn">Switch view</button>
      </div>
    </header>
  `;
}

function attachTopbarHandlers() {
  $('#refresh-btn')?.addEventListener('click', async () => {
    await fetchCases();
    render();
    toast('Refreshed', 'success');
  });
  $('#switch-view-btn')?.addEventListener('click', () => {
    state.view = null;
    state.pinUnlocked = false;
    setUrlView(null);
    stopAutoRefresh();
    render();
  });
}

function renderSetupNotice() {
  return `
    <div class="setup-notice">
      <span>⚙️</span>
      <div>
        <strong>Setup needed:</strong> Open this file and paste your Apps Script Web App URL into <code>CONFIG.APPS_SCRIPT_URL</code>. Until then, no data will load.
      </div>
    </div>
  `;
}

/* =========================================================
   AUTO-REFRESH
   ========================================================= */
let refreshTimer = null;
function startAutoRefresh() {
  stopAutoRefresh();
  refreshTimer = setInterval(async () => {
    const prev = JSON.stringify(state.cases.map(c => ({ id: c.id, stage: currentStage(c).id })));
    await fetchCases();
    const next = JSON.stringify(state.cases.map(c => ({ id: c.id, stage: currentStage(c).id })));
    if (prev !== next) {
      // Re-render and visually highlight changed lobby tiles
      render();
      if (state.view === 'lobby') flashUpdated();
    } else {
      // Just update the "last updated" text on lobby/board
      if (state.view === 'lobby') {
        const foot = $('.lobby-foot');
        if (foot) foot.lastElementChild.textContent = `Updates every ${CONFIG.REFRESH_MS/1000}s · Last updated ${fmtTime(state.lastFetch)}`;
      }
      if (state.view === 'board') {
        const foot = $('.board-foot');
        if (foot) foot.lastElementChild.textContent = `Auto-refresh every ${CONFIG.REFRESH_MS/1000}s · Last updated ${fmtTime(state.lastFetch)}`;
      }
    }
  }, CONFIG.REFRESH_MS);
}
function stopAutoRefresh() {
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
}
function flashUpdated() {
  $$('.lobby-tile').forEach(t => {
    t.classList.add('updated');
    setTimeout(() => t.classList.remove('updated'), 2000);
  });
}

/* =========================================================
   STARTUP
   ========================================================= */
async function start() {
  state.view = getViewFromUrl();
  render();
  if (state.view && (state.view !== 'staff' || state.pinUnlocked)) {
    await fetchCases();
    render();
    startAutoRefresh();
  }
}
start();
</script>
